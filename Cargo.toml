[package]
name = "mutenroshi"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "tokio"] }
base64 = "0.23.1"
getrandom = "0.4.3"
hmac = "0.13.0"
mustache2 = { version = "1.0.7", features = ["ext-inheritance", "serde"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
